name: Generate Snake Game 🐍

on:
  schedule:
    - cron: "0 0 * * *" # every day at midnight
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: Hamid-Javed
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=gruvbox&color_snake=#ff5500&color_dots=#ffa500,#ff7f50,#ff6347&animation_duration=6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#39ff14&color_dots=#39ff14,#00ffcc,#ffffff&animation_duration=6

      - name: Push snake.svg to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
